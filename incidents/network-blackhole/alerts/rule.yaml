# Applied by inject.sh into the monitoring namespace; the `release: prometheus`
# label is required by kube-prometheus-stack's rule selector, and the `labfault`
# alert label routes it to the pager (see
# platform/monitoring/metrics/prometheus/values.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: labfault-network-blackhole
  labels:
    release: prometheus
    labfault: "true"
spec:
  groups:
    - name: labfault-network-blackhole
      rules:
        # The endpoints are healthy here, the packets never arrive, so an
        # endpoint-count alert cannot see this. It fires on failures from either
        # side: 5xx at the edge (Traefik's service label is
        # "<namespace>-<service>-<port>@kubernetes"), or failed requests from the
        # k6 generator, which calls the workload's Service without the ingress.
        - alert: LabFaultIngressErrors
          expr: |
            sum by (service) (rate(traefik_service_requests_total{service=~"${TARGET_NAMESPACE}-${TARGET_WORKLOAD}-.*",code=~"5.."}[2m])) > 0
              or
            sum(rate(k6_http_reqs_total{url=~"https?://${TARGET_WORKLOAD}\\..*",expected_response="false"}[2m])) > 0
          for: 1m
          labels:
            labfault: "true"
            severity: critical
          annotations:
            summary: "${TARGET_NAMESPACE}/${TARGET_WORKLOAD} is failing requests"
            description: "Requests to this service are failing, at the ingress or from in-cluster clients. Its pods may be Running and Ready - check whether anything is stopping the traffic reaching them."
